[project]
name = "evidence-engine"
version = "0.1.0"
description = "Ownership-transparency platform: PE ownership of local businesses + private credit exposure in retirement funds, as one graph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "celery>=5.4,<6.0",
    "redis>=5.2,<6.0",
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",
    "boto3>=1.35,<2.0",
    "pandas>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
